name: Deploy Backend
# add comment to trigger job
on:
  push:
    branches: [main]
    paths:
      - 'project/server/**'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: project/server
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt
          .venv/bin/pip install pytest

      - name: Run tests
        working-directory: project/server
        run: .venv/bin/python -m pytest -v

  deploy:
    needs: test
    runs-on: [self-hosted, Linux, X64]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Validate environment
        working-directory: /opt/pet-feeder
        run: |
          if [ ! -f .env ]; then
            echo "::error::Missing /opt/pet-feeder/.env — cannot deploy"
            exit 1
          fi
          if [ ! -f secrets/firebase.json ]; then
            echo "::error::Missing /opt/pet-feeder/secrets/firebase.json — cannot deploy"
            exit 1
          fi
          grep -q 'FIREBASE_CREDENTIALS_HOST_PATH' .env || {
            echo "::error::FIREBASE_CREDENTIALS_HOST_PATH not set in /opt/pet-feeder/.env"
            exit 1
          }

      - name: Sync code to /opt/pet-feeder
        run: |
          rsync -av \
            project/server/app/ \
            project/server/Dockerfile \
            project/server/docker-compose.yml \
            project/server/.dockerignore \
            /opt/pet-feeder/
          rsync -av project/server/requirements.txt /opt/pet-feeder/requirements.txt

      - name: Rebuild and restart
        working-directory: /opt/pet-feeder
        run: |
          docker compose build --no-cache
          docker compose up -d
          docker compose logs --tail=20

      - name: Verify health
        working-directory: /opt/pet-feeder
        run: |
          sleep 5
          curl -sf http://localhost:7890/health || (docker compose logs && exit 1)
